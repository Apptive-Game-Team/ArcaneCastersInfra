# Game server for a host with about 1 GB of memory.
#
# The blue/green deployer in ../docker-compose.yml needs two JVMs up during a
# swap, which does not fit. Watchtower stops the old container before it starts
# the new one, so only one JVM exists at a time. The price is that a deploy
# ends every match in progress. Use this for a dev host, not for production.
#
# Run from this directory with game.env beside this file.

services:
  game:
    image: ${GAME_IMAGE:-ghcr.io/apptive-game-team/ac-game:dev}
    container_name: ${GAME_NAME:-dev-game}
    restart: unless-stopped
    networks:
      - net
    env_file:
      - game.env
    volumes:
      - ./keys:/keys:ro
    environment:
      # Inside the container the ports are fixed; only the published ones move.
      PORT: 8080
      MANAGEMENT_PORT: 8081
      EXTERNAL_PORT: ${PUBLIC_PORT:-7080}
      INTERNAL_BASE_URL: http://${GAME_NAME:-dev-game}:8080
      # The image's default heap is a quarter of host memory, which on a 1 GB
      # host leaves the container no room for metaspace and thread stacks.
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx${JAVA_HEAP_MB:-320}m -Xss512k -XX:MaxMetaspaceSize=128m
    ports:
      - "${PUBLIC_PORT:-7080}:8080"
      - "127.0.0.1:${MANAGEMENT_PORT:-7081}:8081"
    mem_limit: 640m
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    networks:
      - net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Registry credentials for the private ghcr.io image. Without them the
      # pull is anonymous and comes back unauthorized.
      - ${DOCKER_CONFIG_DIR:-~/.docker}/config.json:/config.json:ro
    environment:
      # Only containers labelled enable=true are touched, so watchtower never
      # restarts itself or anything else on the host.
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: ${POLL_INTERVAL:-60}
      WATCHTOWER_CLEANUP: "true"
      DOCKER_CONFIG: /
    mem_limit: 64m
    labels:
      com.centurylinklabs.watchtower.enable: "false"

networks:
  net:
    name: net
